- name: Compiler et Créer l'exécutable
      run: |
        # 1. Installation des dépendances Python
        pip3 install --break-system-packages selenium pillow img2pdf pyinstaller
        
        # 2. Compilation en un fichier unique
        python3 -m PyInstaller --onefile --noconsole --name "SushiApp_Linux" main.py
        
        # 3. On ne s'embête plus avec l'AppImage pour l'instant, 
        # on récupère directement l'exécutable Linux qui fonctionne partout !
        cp dist/SushiApp_Linux .

    - name: Sauvegarder l'application
      uses: actions/upload-artifact@v4
      with:
        name: SushiScan_Linux_Raspberry
        path: SushiApp_Linux
