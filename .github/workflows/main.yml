name: Compilation Linux AppImage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installation des outils
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-tk wget binutils
        # On force l'installation des paquets Python pour Debian 12
        pip3 install --break-system-packages selenium pillow img2pdf pyinstaller

    - name: Compiler et Créer AppImage
      run: |
        python3 -m PyInstaller --onefile --noconsole --name "SushiApp" main.py
        
        # Structure AppImage rapide
        mkdir -p AppDir/usr/bin
        cp dist/SushiApp AppDir/usr/bin/
        echo '#!/bin/sh' > AppDir/AppRun
        echo 'exec "${0%/*}/usr/bin/SushiApp" "$@"' >> AppDir/AppRun
        chmod +x AppDir/AppRun
        
        echo '[Desktop Entry]\nName=SushiApp\nExec=SushiApp\nIcon=sushi\nType=Application' > AppDir/SushiApp.desktop
        wget -qO AppDir/sushi.png https://cdn-icons-png.flaticon.com/512/3143/3143644.png
        
        # Outil spécifique ARM64
        wget -qO appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-aarch64.AppImage
        chmod +x appimagetool
        ./appimagetool --appimage-extract-and-run AppDir SushiApp-Linux-ARM64.AppImage

    - name: Sauvegarder
      uses: actions/upload-artifact@v4
      with:
        name: Application_Linux_ARM64
        path: SushiApp-Linux-ARM64.AppImage
