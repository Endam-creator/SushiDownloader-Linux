name: Compilation Linux AppImage sur Raspberry Pi

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Préparer le système (Debian 12)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-tk wget binutils

    - name: Installer les bibliothèques Python
      run: |
        pip3 install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install pyinstaller

    - name: Compiler avec PyInstaller
      run: |
        # On s'assure d'utiliser PyInstaller installé via pip3
        python3 -m PyInstaller --onefile --noconsole --name "SushiApp" main.py

    - name: Fabriquer le format AppImage
      run: |
        # 1. Créer la structure
        mkdir -p AppDir/usr/bin
        cp dist/SushiApp AppDir/usr/bin/
        
        # 2. Créer l'AppRun
        echo '#!/bin/sh' > AppDir/AppRun
        echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
        echo 'exec "${HERE}/usr/bin/SushiApp" "$@"' >> AppDir/AppRun
        chmod +x AppDir/AppRun
        
        # 3. Créer le fichier Desktop
        echo '[Desktop Entry]' > AppDir/SushiApp.desktop
        echo 'Name=SushiApp' >> AppDir/SushiApp.desktop
        echo 'Exec=SushiApp' >> AppDir/SushiApp.desktop
        echo 'Icon=sushi' >> AppDir/SushiApp.desktop
        echo 'Type=Application' >> AppDir/SushiApp.desktop
        echo 'Categories=Utility;' >> AppDir/SushiApp.desktop
        
        # 4. Icône par défaut
        wget -qO AppDir/sushi.png https://cdn-icons-png.flaticon.com/512/3143/3143644.png
        
        # 5. Outil AppImage pour ARM64 (Lien spécifique Raspberry Pi 5)
        wget -qO appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-aarch64.AppImage
        chmod +x appimagetool
        
        # 6. Assemblage final
        ./appimagetool --appimage-extract-and-run AppDir SushiApp-Linux-ARM64.AppImage

    - name: Sauvegarder l'AppImage
      uses: actions/upload-artifact@v4
      with:
        name: Application_Linux_ARM64
        path: SushiApp-Linux-ARM64.AppImage
